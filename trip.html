<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0F766E">
  <title>تفاصيل الرحلة — ترحال</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    #trip-loading, #trip-notfound {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-gray);
    }
    .trip-cover {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #0F766E 0%, #14B8A6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 64px;
      position: relative;
      overflow: hidden;
      max-height: 420px;
    }
    .trip-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .trip-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      margin-top: -60px;
      position: relative;
      z-index: 2;
    }
    .trip-header-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .trip-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
      color: var(--text-dark);
    }
    .trip-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 14px;
      color: var(--text-gray);
      margin-bottom: 16px;
    }
    .trip-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .trip-meta-item svg {
      color: var(--primary);
      flex-shrink: 0;
    }
    .trip-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(15,118,110,0.1);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .trip-badge-verified {
      background: rgba(22,163,74,0.1);
      color: var(--success);
    }
    .trip-price-card {
      background: white;
      border: 2px solid var(--primary);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
    }
    .trip-price-label {
      font-size: 13px;
      color: var(--text-gray);
      margin-bottom: 4px;
    }
    .trip-price-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
    }
    .trip-price-per {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-gray);
    }
    .trip-seats {
      font-size: 13px;
      color: var(--warning);
      font-weight: 600;
      margin-bottom: 16px;
    }
    .tabs-nav {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
      overflow-x: auto;
      gap: 4px;
    }
    .tabs-nav button {
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-gray);
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
      background: none;
      font-family: inherit;
      cursor: pointer;
    }
    .tabs-nav button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .tab-content.active {
      display: block;
    }
    .info-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 16px;
    }
    .info-card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-card-text {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-medium);
      white-space: pre-wrap;
    }
    .check-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .check-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      font-size: 14px;
      color: var(--text-medium);
      line-height: 1.5;
    }
    .check-list li svg {
      flex-shrink: 0;
      margin-top: 3px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
/* ===== PHOTO GALLERY ===== */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 4px;
}
@media (min-width: 640px) {
  .photo-grid { grid-template-columns: repeat(3, 1fr); }
}
.photo-item {
  aspect-ratio: 1;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  background: var(--bg-gray);
  transition: transform 0.2s;
}
.photo-item:hover {
  transform: scale(1.02);
}
.photo-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.photo-item-label {
  position: absolute;
  bottom: 0;
  inset-inline: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
  color: white;
  padding: 8px 10px 6px;
  font-size: 12px;
  font-weight: 600;
}
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 85vh;
  border-radius: 12px;
  object-fit: contain;
}
.lightbox-close {
  position: absolute;
  top: 20px;
  inset-inline-end: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  cursor: pointer;
  border: none;
}
.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  cursor: pointer;
  border: none;
}
.lightbox-prev { inset-inline-start: 16px; }
.lightbox-next { inset-inline-end: 16px; }
.lightbox-caption {
  position: absolute;
  bottom: 30px;
  inset-inline: 30px;
  color: white;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
}
/* ===== ALBUMS ===== */
.album {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
}
.album-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.album-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-dark);
}
.album-title-icon {
  font-size: 22px;
  line-height: 1;
}
.album-count {
  font-size: 12px;
  color: var(--text-gray);
  background: var(--bg-gray);
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 600;
}
.album-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
@media (min-width: 640px) {
  .album-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
.album-photo {
  aspect-ratio: 1;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  background: var(--bg-gray);
  transition: transform 0.2s;
}
.album-photo:active {
  transform: scale(0.97);
}
.album-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.album-photo-label {
  position: absolute;
  bottom: 0;
  inset-inline: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
  color: white;
  padding: 14px 8px 6px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.3;
  text-align: center;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
  </style>
</head>
<body>
<div id="error-box" style="display:none; position:fixed; top:0; left:0; right:0; background:#DC2626; color:white; padding:12px; z-index:99999; font-size:13px; direction:ltr; text-align:left; font-family:monospace; max-height:40vh; overflow:auto;"></div>
<script>
window.onerror = function(msg, url, line, col) {
  var box = document.getElementById('error-box');
  if (box) {
    box.style.display = 'block';
    box.textContent += 'ERROR: ' + msg + ' | line ' + line + ':' + col + '\n';
  }
};
</script>

  <script>
    // ============================================
    // STATE
    // ============================================
    let currentTrip = null;

    // ============================================
    // INIT
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      initApp();
      loadTrip();
    });

    // ============================================
    // LOAD TRIP
    // ============================================
    function loadTrip() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      if (!slug) return showNotFound();

      const trip = MOCK_TRIPS.find(t => t.slug === slug);
      if (!trip) return showNotFound();

      currentTrip = trip;
      renderTrip(trip);
    }

    function showNotFound() {
      document.getElementById('trip-loading').style.display = 'none';
      document.getElementById('trip-notfound').style.display = 'block';
    }

    // ============================================
    // RENDER TRIP
    // ============================================
    function renderTrip(trip) {
      const isAr = isRTL();

      // Hide loading, show content
      document.getElementById('trip-loading').style.display = 'none';
      document.getElementById('trip-content').style.display = 'block';

      // Page title
      document.title = (isAr ? trip.title_ar : trip.title_en) + ' — ترحال';

      // Cover
      const cover = document.getElementById('trip-cover');
      if (trip.cover_url) {
        cover.innerHTML = `<img src="${trip.cover_url}" alt="">`;
      } else {
        cover.innerHTML = '🏝️';
      }

      // Type badge
      document.getElementById('trip-type-badge').textContent = t('tripTypes.' + trip.trip_type);

      // Company badge (mock — first trip only for demo)
      const companyBadge = document.getElementById('trip-company-badge');
      if (trip.id === '1' || trip.id === '4') {
        companyBadge.innerHTML = `<span class="trip-badge trip-badge-verified">✓ شركة موثقة</span>`;
      }

      // Title
      document.getElementById('trip-title').textContent = isAr ? trip.title_ar : trip.title_en;

      // Meta
      const destCountry = getCountryByCode(trip.destination_country);
      const destName = destCountry ? (isAr ? destCountry.nameAr : destCountry.nameEn) : trip.destination_country;

      document.getElementById('trip-meta').innerHTML = `
        <div class="trip-meta-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          ${trip.days} ${t('trips.days')} / ${trip.nights} ${t('trips.nights')}
        </div>
        <div class="trip-meta-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          ${destName}
        </div>
        ${trip.rating_avg > 0 ? `
        <div class="trip-meta-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#F59E0B" stroke="#F59E0B" stroke-width="1">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          ${trip.rating_avg.toFixed(1)}
        </div>
        ` : ''}
      `;

      // Price
      document.getElementById('trip-price').textContent = formatPrice(trip.base_price, trip.currency);

      // Seats
      const seats = document.getElementById('trip-seats');
      if (trip.seats_available > 0) {
        seats.textContent = `⚡ ${trip.seats_available} مقعد متبقي`;
      } else {
        seats.textContent = '❌ مكتمل';
        document.getElementById('book-btn').disabled = true;
      }

      // Description
      document.getElementById('trip-description').textContent =
        isAr ? (trip.description_ar || '—') : (trip.description_en || trip.description_ar || '—');

      // Company info
      if (trip.id === '1') {
        document.getElementById('company-card').style.display = 'block';
        document.getElementById('company-info').innerHTML = `
          <div style="font-weight:600; margin-bottom:4px;">شركة النور للسياحة</div>
          <div style="font-size:13px;">شركة متخصصة في تنظيم رحلات العمرة والحج منذ 2010.</div>
        `;
      }

      // Itinerary (mock timeline)
      renderItinerary(trip);

      // Included / Excluded
      renderList('included-list', [
        'تذاكر الطيران ذهاب وعودة',
        'الإقامة في الفندق المذكور',
        'الوجبات المذكورة في البرنامج',
        'الانتقالات الداخلية',
        'المرشد السياحي',
      ], 'check');

      renderList('excluded-list', [
        'المصاريف الشخصية',
        'التأمين الصحي',
        'الأنشطة الاختيارية',
        'الوجبات غير المذكورة',
      ], 'x');

      // Requirements
      renderList('requirements-list', [
        'جواز سفر ساري لمدة 6 أشهر على الأقل',
        'صورة شخصية حديثة',
        'التأشيرة (يتم استخراجها بواسطة الشركة)',
        'شهادة التطعيم (إن وجدت)',
      ], 'doc');

      // Setup tabs
      setupTabs();

      // Setup buttons
      renderGallery(trip);
      setupButtons(trip);
    }

    // ============================================
    // RENDER ITINERARY
    // ============================================
    function renderItinerary(trip) {
      const container = document.getElementById('itinerary-list');
      const isAr = isRTL();

      // Sample itinerary items — will be replaced with real data later
      const items = [
        { day: 1, type: 'flight', icon: '✈️', title: 'الإقلاع من مطار القاهرة', time: '08:00', note: 'رحلة مباشرة' },
        { day: 1, type: 'hotel', icon: '🏨', title: 'الوصول وتسجيل الدخول للفندق', time: '14:00', note: 'فندق 5 نجوم' },
        { day: 1, type: 'meal', icon: '🍽️', title: 'عشاء في الفندق', time: '20:00', note: '' },
        { day: 2, type: 'activity', icon: '🕌', title: 'زيارة المعالم الرئيسية', time: '09:00', note: 'مع مرشد' },
        { day: 2, type: 'meal', icon: '🍽️', title: 'غداء', time: '13:00', note: '' },
        { day: 3, type: 'activity', icon: '🛍️', title: 'يوم تسوق حر', time: '10:00', note: 'اختياري' },
        { day: 4, type: 'hotel', icon: '🏨', title: 'تسجيل الخروج', time: '11:00', note: '' },
        { day: 4, type: 'flight', icon: '✈️', title: 'العودة إلى القاهرة', time: '17:00', note: '' },
      ];

      const byDay = {};
      items.forEach(it => {
        if (!byDay[it.day]) byDay[it.day] = [];
        byDay[it.day].push(it);
      });

      container.innerHTML = Object.keys(byDay).map(day => `
        <div class="info-card">
          <div class="info-card-title">

              <div style="position:relative; padding:10px 0 10px 16px;">
                <span style="position:absolute; inset-inline-start:-17px; top:14px; width:12px; height:12px; border-radius:50%; background:var(--primary); border:2px solid white; box-shadow:0 0 0 2px var(--primary);"></span>

          </div>
        </div>
      `).join('');
    }

    // ============================================
    // RENDER LIST
    // ============================================
    function renderList(elementId, items, iconType) {
      const container = document.getElementById(elementId);
      if (!container) return;

      let icon = '';
      if (iconType === 'check') {
        icon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5" style="flex-shrink:0; margin-top:3px;"><polyline points="20 6 9 17 4 12"/></svg>';
      } else if (iconType === 'x') {
        icon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--error)" stroke-width="2.5" style="flex-shrink:0; margin-top:3px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      } else {
        icon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" style="flex-shrink:0; margin-top:3px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
      }

      container.innerHTML = items.map(item => `<li>${icon} <span>${item}</span></li>`).join('');
    }

    // ============================================
    // SETUP TABS
    // ============================================
    function setupTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.dataset.tab;

          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

          btn.classList.add('active');
          document.querySelector(`.tab-content[data-tab-content="${tab}"]`).classList.add('active');
        });
      });
    }

    // ============================================
    // SETUP BUTTONS
    // ============================================
    function setupButtons(trip) {
      // Book button
      document.getElementById('book-btn').addEventListener('click', () => {
        const user = getCurrentUser();
        if (!user) {
          showToast('من فضلك سجّل دخولك أولاً', 'error');
          setTimeout(() => {
            window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
          }, 1200);
          return;
        }
        // Will implement booking flow later
        showToast('سيتم تفعيل الحجز قريبًا', 'info');
      });

      // Compare button
      document.getElementById('compare-btn').addEventListener('click', () => {
        showToast('سيتم تفعيل المقارنة قريبًا', 'info');
      });
    }

// ============================================
// LIGHTBOX — Album-aware
// ============================================
let currentAlbumIndex = 0;
let currentPhotoIndex = 0;

function openLightbox(albumIndex, photoIndex) {
  currentAlbumIndex = albumIndex;
  currentPhotoIndex = photoIndex;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function updateLightbox() {
  const albums = window._galleryAlbums || [];
  const album = albums[currentAlbumIndex];
  if (!album) return;

  const photo = album.photos[currentPhotoIndex];
  if (!photo) return;

  // Use bigger image for lightbox
  const bigUrl = photo.url.replace('800/800', '1600/1200');
  document.getElementById('lb-img').src = bigUrl;
  document.getElementById('lb-caption').textContent =
    `${album.icon} ${album.title} — ${photo.label}`;

  // Hide nav arrows if only 1 photo in album
  const hasMultiple = album.photos.length > 1;
  document.getElementById('lb-prev').style.display = hasMultiple ? 'flex' : 'none';
  document.getElementById('lb-next').style.display = hasMultiple ? 'flex' : 'none';
}

function nextImage() {
  const albums = window._galleryAlbums || [];
  const album = albums[currentAlbumIndex];
  if (!album) return;
  currentPhotoIndex = (currentPhotoIndex + 1) % album.photos.length;
  updateLightbox();
}

function prevImage() {
  const albums = window._galleryAlbums || [];
  const album = albums[currentAlbumIndex];
  if (!album) return;
  currentPhotoIndex = (currentPhotoIndex - 1 + album.photos.length) % album.photos.length;
  updateLightbox();
}
