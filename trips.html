<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0F766E">
  <title>الرحلات — ترحال</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    /* ===== TOP SEARCH BAR ===== */
    .top-search-bar {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      margin: 16px 0;
    }
    .top-search-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    @media (min-width: 640px) {
      .top-search-grid { grid-template-columns: 1fr 1fr 1fr auto; }
    }
    .ts-field-wrap { position: relative; }
    .ts-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: white;
      font-family: inherit;
      min-height: 42px;
      box-sizing: border-box;
    }
    .ts-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15,118,110,0.1);
    }
    .ts-dd {
      position: absolute;
      top: 100%;
      inset-inline: 0;
      margin-top: 4px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      max-height: 260px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }
    .ts-dd.open { display: block; }
    .ts-dd-item {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    .ts-dd-item:last-child { border-bottom: none; }
    .ts-dd-item:hover,
    .ts-dd-item.active { background: rgba(15,118,110,0.06); }
    .ts-dd-flag { font-size: 18px; line-height: 1; }
    .ts-dd-name { flex: 1; }
    .ts-dd-sub {
      font-size: 11px;
      color: var(--text-gray);
      display: block;
    }
    .ts-dd-empty {
      padding: 14px;
      text-align: center;
      color: var(--text-gray);
      font-size: 13px;
    }

    /* ===== MOBILE FILTER TOGGLE ===== */
    .mobile-filter-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-weight: 600;
      color: var(--text-dark);
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }
    .mobile-filter-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    @media (min-width: 900px) {
      .mobile-filter-toggle { display: none; }
    }

    /* ===== LAYOUT ===== */
    .trips-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      padding: 8px 0 40px;
    }
    @media (min-width: 900px) {
      .trips-layout { grid-template-columns: 280px 1fr; }
    }

    /* ===== FILTERS PANEL ===== */
    .filters-panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      height: fit-content;
    }
    .filters-panel.mobile-closed { display: none; }
    @media (min-width: 900px) {
      .filters-panel,
      .filters-panel.mobile-closed { display: block; }
    }

    .filter-group {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .filter-group:last-child {
      border-bottom: none;
      margin-bottom: 16px;
      padding-bottom: 0;
    }
    .filter-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 12px;
    }
    .filter-options {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .filter-check {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      cursor: pointer;
      padding: 6px 0;
      color: var(--text-medium);
    }
    .filter-check input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ===== SHARED SLIDER STYLES ===== */
    .slider-current {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 14px;
      padding: 8px 12px;
      background: rgba(15,118,110,0.06);
      border-radius: var(--radius);
      gap: 6px;
    }
    .slider-current-val {
      white-space: nowrap;
    }
    .slider-current-sep {
      color: var(--text-gray);
      font-weight: 400;
      font-size: 12px;
    }
    .slider-stack {
      position: relative;
    }
    .range-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
      margin: 4px 0;
      cursor: pointer;
    }
    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: white;
      border: 3px solid var(--primary);
      cursor: grab;
      box-shadow: 0 2px 6px rgba(15,118,110,0.3);
    }
    .range-input::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: white;
      border: 3px solid var(--primary);
      cursor: grab;
      box-shadow: 0 2px 6px rgba(15,118,110,0.3);
    }
    .range-input::-webkit-slider-thumb:active {
      cursor: grabbing;
      transform: scale(1.1);
    }
    .range-input.dual {
      pointer-events: none;
    }
    .range-input.dual::-webkit-slider-thumb {
      pointer-events: auto;
    }
    .range-input.dual::-moz-range-thumb {
      pointer-events: auto;
    }

    /* ===== RATING SLIDER ===== */
    .rating-stars-display {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 26px;
      line-height: 1;
    }
    .rating-star {
      color: var(--border);
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .rating-star.active {
      color: #F59E0B;
      transform: scale(1.05);
    }
    .rating-current {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 14px;
      min-height: 20px;
    }
    .rating-range-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
      margin: 4px 0;
      cursor: pointer;
    }
    .rating-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: white;
      border: 3px solid #F59E0B;
      cursor: grab;
      box-shadow: 0 2px 6px rgba(245,158,11,0.3);
    }
    .rating-range-input::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: white;
      border: 3px solid #F59E0B;
      cursor: grab;
      box-shadow: 0 2px 6px rgba(245,158,11,0.3);
    }

    .slider-marks {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-gray);
      margin-top: 4px;
    }

    /* ===== RESULTS HEADER ===== */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .results-count {
      font-size: 15px;
      color: var(--text-medium);
    }
    .results-count strong {
      color: var(--primary);
      font-weight: 700;
    }
    .sort-select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: white;
      cursor: pointer;
      font-family: inherit;
      min-width: 180px;
    }
    .sort-select:focus {
      outline: none;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <header id="app-header"></header>

  <main class="tarhal-container">

    <!-- ===== TOP SEARCH ===== -->
    <div class="top-search-bar">
      <form class="top-search-grid" id="top-search-form" autocomplete="off">
        <div class="ts-field-wrap" id="ts-from-wrap">
          <input type="text" id="q-from" class="ts-input" placeholder="من — الدولة أو المدينة" autocomplete="off">
          <div class="ts-dd" id="ts-from-dd"></div>
        </div>
        <div class="ts-field-wrap" id="ts-to-wrap">
          <input type="text" id="q-to" class="ts-input" placeholder="إلى — الدولة أو المدينة" autocomplete="off">
          <div class="ts-dd" id="ts-to-dd"></div>
        </div>
        <input type="date" id="q-date" class="ts-input">
        <button type="submit" class="tarhal-btn tarhal-btn-primary">ابحث</button>
      </form>
    </div>

    <h1 style="font-size: 22px; font-weight: 700; margin-bottom: 16px;" id="page-title">الرحلات</h1>

    <!-- ===== MOBILE FILTER TOGGLE ===== -->
    <button type="button" class="mobile-filter-toggle" id="filter-toggle">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
      </svg>
      <span>الفلاتر</span>
    </button>

    <div class="trips-layout">

      <!-- ===== FILTERS ===== -->
      <aside class="filters-panel mobile-closed" id="filters-panel">

        <div class="filter-group">
          <div class="filter-title">نوع الرحلة</div>
          <div class="filter-options" id="type-filters"></div>
        </div>

        <!-- PRICE SLIDER -->
        <div class="filter-group">
          <div class="filter-title">السعر</div>
          <div class="slider-current">
            <span class="slider-current-val" id="price-min-display">—</span>
            <span class="slider-current-sep">←</span>
            <span class="slider-current-val" id="price-max-display">—</span>
          </div>
          <div class="slider-stack">
            <input type="range" class="range-input dual" id="price-min-range" min="0" max="100" value="0">
            <input type="range" class="range-input dual" id="price-max-range" min="0" max="100" value="100">
          </div>
        </div>

        <!-- DURATION SLIDER -->
        <div class="filter-group">
          <div class="filter-title">المدة</div>
          <div class="slider-current">
            <span class="slider-current-val" id="days-min-display">—</span>
            <span class="slider-current-sep">←</span>
            <span class="slider-current-val" id="days-max-display">—</span>
          </div>
          <div class="slider-stack">
            <input type="range" class="range-input dual" id="days-min-range" min="1" max="30" value="1">
            <input type="range" class="range-input dual" id="days-max-range" min="1" max="30" value="30">
          </div>
          <div class="slider-marks">
            <span id="days-lowest-mark">1</span>
            <span id="days-highest-mark">30</span>
          </div>
        </div>

        <!-- RATING SLIDER -->
        <div class="filter-group">
          <div class="filter-title">التقييم</div>
          <div class="rating-stars-display" id="rating-stars-display">
            <span class="rating-star" data-star="1">★</span>
            <span class="rating-star" data-star="2">★</span>
            <span class="rating-star" data-star="3">★</span>
            <span class="rating-star" data-star="4">★</span>
            <span class="rating-star" data-star="5">★</span>
          </div>
          <div class="rating-current" id="rating-current">الكل</div>
          <input type="range" class="rating-range-input" id="rating-range" min="0" max="5" step="0.5" value="0">
        </div>

        <button type="button" class="tarhal-btn tarhal-btn-outline tarhal-btn-block" id="clear-filters">مسح الفلاتر</button>

      </aside>

      <!-- ===== RESULTS ===== -->
      <section>
        <div class="results-header">
          <div class="results-count">
            <strong id="results-number">0</strong> نتيجة
          </div>
          <select class="sort-select" id="sort-select">
            <option value="newest">الأحدث</option>
            <option value="price-low">السعر: من الأقل للأعلى</option>
            <option value="price-high">السعر: من الأعلى للأقل</option>
            <option value="rating">الأعلى تقييمًا</option>
            <option value="days-low">المدة: الأقصر أولاً</option>
            <option value="days-high">المدة: الأطول أولاً</option>
          </select>
        </div>

        <div class="tarhal-grid tarhal-grid-3" id="trips-grid"></div>
      </section>

    </div>

  </main>

  <footer id="app-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    // ============================================
    // STATE
    // ============================================
    let allTrips = [];
    let filteredTrips = [];
    let priceBounds = { min: 0, max: 100000 };
    let daysBounds = { min: 1, max: 30 };
    let filters = {
      types: [],
      minPrice: null,
      maxPrice: null,
      minDays: null,
      maxDays: null,
      rating: null,
      from: '',
      to: '',
      date: '',
    };

    // ============================================
    // INIT
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      initApp();
      loadInitialData();
      renderTypeFilters();
      setupPriceSlider();
      setupDaysSlider();
      setupRatingSlider();
      setupFilterEvents();
      setupSearchBar();
      setupTopAutocomplete();
      applyFiltersAndRender();
    });

    // ============================================
    // LOAD
    // ============================================
    function loadInitialData() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type');
      const from = params.get('from');
      const to = params.get('to');
      const date = params.get('date');
      const q = params.get('q');

      if (type) filters.types = [type];
      if (from) { filters.from = from; document.getElementById('q-from').value = from; }
      if (to) { filters.to = to; document.getElementById('q-to').value = to; }
      if (date) { filters.date = date; document.getElementById('q-date').value = date; }
      if (q) { filters.to = q; document.getElementById('q-to').value = q; }

      allTrips = [...MOCK_TRIPS];

      if (allTrips.length > 0) {
        const prices = allTrips.map(t => t.base_price);
        const daysArr = allTrips.map(t => t.days);

        priceBounds.min = Math.min(...prices);
        priceBounds.max = Math.max(...prices);

        daysBounds.min = Math.max(1, Math.min(...daysArr));
        daysBounds.max = Math.max(...daysArr);
      }

      if (type) {
        document.getElementById('page-title').textContent = t('tripTypes.' + type);
      }
    }

    // ============================================
    // TYPE FILTERS
    // ============================================
    function renderTypeFilters() {
      const container = document.getElementById('type-filters');
      const types = [
        { key: 'umrah' }, { key: 'hajj' }, { key: 'leisure' },
        { key: 'adventure' }, { key: 'family' }, { key: 'honeymoon' },
        { key: 'cruise' }, { key: 'cultural' },
      ];
      container.innerHTML = types.map(tp => `
        <label class="filter-check">
          <input type="checkbox" data-type="${tp.key}" ${filters.types.includes(tp.key) ? 'checked' : ''}>
          <span>${t('tripTypes.' + tp.key)}</span>
        </label>
      `).join('');
    }

    // ============================================
    // PRICE SLIDER
    // ============================================
    function setupPriceSlider() {
      const minRange = document.getElementById('price-min-range');
      const maxRange = document.getElementById('price-max-range');
      const minDisplay = document.getElementById('price-min-display');
      const maxDisplay = document.getElementById('price-max-display');

      function update() {
        let lo = Number(minRange.value);
        let hi = Number(maxRange.value);

        if (lo > hi - 5) {
          if (document.activeElement === minRange) { lo = hi - 5; minRange.value = lo; }
          else { hi = lo + 5; maxRange.value = hi; }
        }

        const priceLo = Math.round(priceBounds.min + (priceBounds.max - priceBounds.min) * (lo / 100));
        const priceHi = Math.round(priceBounds.min + (priceBounds.max - priceBounds.min) * (hi / 100));

        minDisplay.textContent = formatPrice(priceLo);
        maxDisplay.textContent = formatPrice(priceHi);

        filters.minPrice = (lo > 0) ? priceLo : null;
        filters.maxPrice = (hi < 100) ? priceHi : null;

        applyFiltersAndRender();
      }

      minRange.addEventListener('input', update);
      maxRange.addEventListener('input', update);

      window._resetPriceSlider = () => {
        minRange.value = 0;
        maxRange.value = 100;
        minDisplay.textContent = formatPrice(priceBounds.min);
        maxDisplay.textContent = formatPrice(priceBounds.max);
        filters.minPrice = null;
        filters.maxPrice = null;
      };

      minDisplay.textContent = formatPrice(priceBounds.min);
      maxDisplay.textContent = formatPrice(priceBounds.max);
    }

    // ============================================
    // DAYS SLIDER
    // ============================================
    function setupDaysSlider() {
      const minRange = document.getElementById('days-min-range');
      const maxRange = document.getElementById('days-max-range');
      const minDisplay = document.getElementById('days-min-display');
      const maxDisplay = document.getElementById('days-max-display');
      const lowestMark = document.getElementById('days-lowest-mark');
      const highestMark = document.getElementById('days-highest-mark');

      minRange.min = daysBounds.min;
      minRange.max = daysBounds.max;
      minRange.value = daysBounds.min;

      maxRange.min = daysBounds.min;
      maxRange.max = daysBounds.max;
      maxRange.value = daysBounds.max;

      lowestMark.textContent = daysBounds.min;
      highestMark.textContent = daysBounds.max;

      function update() {
        let lo = Number(minRange.value);
        let hi = Number(maxRange.value);

        if (lo > hi - 1) {
          if (document.activeElement === minRange) { lo = hi - 1; minRange.value = lo; }
          else { hi = lo + 1; maxRange.value = hi; }
        }

        minDisplay.textContent = lo + ' يوم';
        maxDisplay.textContent = hi + ' يوم';

        filters.minDays = (lo > daysBounds.min) ? lo : null;
        filters.maxDays = (hi < daysBounds.max) ? hi : null;

        applyFiltersAndRender();
      }

      minRange.addEventListener('input', update);
      maxRange.addEventListener('input', update);

      window._resetDaysSlider = () => {
        minRange.value = daysBounds.min;
        maxRange.value = daysBounds.max;
        minDisplay.textContent = daysBounds.min + ' يوم';
        maxDisplay.textContent = daysBounds.max + ' يوم';
        filters.minDays = null;
        filters.maxDays = null;
      };

      minDisplay.textContent = daysBounds.min + ' يوم';
      maxDisplay.textContent = daysBounds.max + ' يوم';
    }

    // ============================================
    // RATING SLIDER
    // ============================================
    function setupRatingSlider() {
      const range = document.getElementById('rating-range');
      const current = document.getElementById('rating-current');
      const stars = document.querySelectorAll('#rating-stars-display .rating-star');

      function update() {
        const val = Number(range.value);

        stars.forEach(star => {
          const starVal = Number(star.dataset.star);
          star.classList.toggle('active', starVal <= val);
        });

        current.textContent = val === 0 ? 'الكل' : `⭐ ${val} فأكثر`;

        filters.rating = val > 0 ? val : null;
        applyFiltersAndRender();
      }

      range.addEventListener('input', update);

      window._resetRatingSlider = () => {
        range.value = 0;
        stars.forEach(s => s.classList.remove('active'));
        current.textContent = 'الكل';
        filters.rating = null;
      };
    }

    // ============================================
    // FILTER EVENTS
    // ============================================
    function setupFilterEvents() {
      document.querySelectorAll('#type-filters input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
          filters.types = Array.from(document.querySelectorAll('#type-filters input:checked'))
            .map(el => el.dataset.type);
          applyFiltersAndRender();
        });
      });

      document.getElementById('sort-select').addEventListener('change', () => {
        applyFiltersAndRender();
      });

      document.getElementById('clear-filters').addEventListener('click', () => {
        filters = { types: [], minPrice: null, maxPrice: null, minDays: null, maxDays: null, rating: null, from: '', to: '', date: '' };
        document.querySelectorAll('#type-filters input').forEach(cb => cb.checked = false);
        document.getElementById('q-from').value = '';
        document.getElementById('q-to').value = '';
        document.getElementById('q-date').value = '';
        if (window._resetPriceSlider) window._resetPriceSlider();
        if (window._resetDaysSlider) window._resetDaysSlider();
        if (window._resetRatingSlider) window._resetRatingSlider();
        applyFiltersAndRender();
      });

      document.getElementById('filter-toggle').addEventListener('click', () => {
        document.getElementById('filters-panel').classList.toggle('mobile-closed');
      });
    }

    // ============================================
    // SEARCH BAR
    // ============================================
    function setupSearchBar() {
      document.getElementById('top-search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        filters.from = document.getElementById('q-from').value.trim();
        filters.to = document.getElementById('q-to').value.trim();
        filters.date = document.getElementById('q-date').value;
        applyFiltersAndRender();
      });
    }

    // ============================================
    // TOP AUTOCOMPLETE
    // ============================================
    function setupTopAutocomplete() {
      new TopAutocomplete('q-from', 'ts-from-dd', 'ts-from-wrap');
      new TopAutocomplete('q-to', 'ts-to-dd', 'ts-to-wrap');
    }

    class TopAutocomplete {
      constructor(inputId, ddId, wrapId) {
        this.input = document.getElementById(inputId);
        this.dd = document.getElementById(ddId);
        this.wrap = document.getElementById(wrapId);
        this.items = [];
        this.activeIndex = -1;
        this._debounce = null;
        this.init();
      }
      init() {
        this.input.addEventListener('focus', () => this.onFocus());
        this.input.addEventListener('input', () => this.onInput());
        this.input.addEventListener('keydown', (e) => this.onKey(e));
        document.addEventListener('click', (e) => {
          if (!this.wrap.contains(e.target)) this.close();
        });
      }
      async onFocus() {
        if (!this.input.value) await this.showResults('');
      }
      onInput() {
        clearTimeout(this._debounce);
        this._debounce = setTimeout(async () => {
          const q = this.input.value.trim();
          if (q.length === 0) { this.close(); return; }
          await this.showResults(q);
        }, 120);
      }
      async showResults(query) {
        this.dd.innerHTML = '<div class="ts-dd-empty">...</div>';
        this.dd.classList.add('open');
        try {
          if (query.length === 0) {
            const isAr = isRTL();
            this.items = COUNTRIES_DB.slice(0, 20).map(c => ({
              type: 'country', code: c.code, flag: c.flag,
              name: isAr ? c.ar : c.en,
              sub: isAr ? c.en : c.ar,
              displayName: `${c.flag} ${isAr ? c.ar : c.en}`,
            }));
          } else {
            this.items = await searchAll(query);
          }
        } catch (e) { this.items = []; }
        this.render();
      }
      render() {
        if (this.items.length === 0) {
          this.dd.innerHTML = `<div class="ts-dd-empty">لا توجد نتائج</div>`;
          return;
        }
        this.dd.innerHTML = this.items.map((item, i) => `
          <div class="ts-dd-item" data-index="${i}">
            <span class="ts-dd-flag">${item.flag || '📍'}</span>
            <span class="ts-dd-name">
              ${item.name}
              <span class="ts-dd-sub">${item.sub || ''}</span>
            </span>
          </div>
        `).join('');
        this.dd.querySelectorAll('.ts-dd-item').forEach(el => {
          el.addEventListener('click', () => this.select(Number(el.dataset.index)));
        });
        this.activeIndex = -1;
      }
      select(index) {
        const item = this.items[index];
        if (!item) return;
        this.input.value = item.displayName;
        this.close();
      }
      onKey(e) {
        if (!this.dd.classList.contains('open')) return;
        const items = this.dd.querySelectorAll('.ts-dd-item');
        if (items.length === 0) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          this.activeIndex = Math.min(this.activeIndex + 1, items.length - 1);
          this.highlight(items);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          this.activeIndex = Math.max(this.activeIndex - 1, 0);
          this.highlight(items);
        } else if (e.key === 'Enter') {
          if (this.activeIndex >= 0) { e.preventDefault(); this.select(this.activeIndex); }
        } else if (e.key === 'Escape') { this.close(); }
      }
      highlight(items) {
        items.forEach((el, i) => el.classList.toggle('active', i === this.activeIndex));
      }
      close() {
        this.dd.classList.remove('open');
        this.dd.innerHTML = '';
        this.activeIndex = -1;
      }
    }

    // ============================================
    // APPLY FILTERS
    // ============================================
    function applyFiltersAndRender() {
      let list = [...allTrips];

      if (filters.types.length > 0) {
        list = list.filter(trip => filters.types.includes(trip.trip_type));
      }

      if (filters.minPrice != null) list = list.filter(t => t.base_price >= filters.minPrice);
      if (filters.maxPrice != null) list = list.filter(t => t.base_price <= filters.maxPrice);

      if (filters.minDays != null) list = list.filter(t => t.days >= filters.minDays);
      if (filters.maxDays != null) list = list.filter(t => t.days <= filters.maxDays);

      if (filters.rating != null) {
        list = list.filter(t => (t.rating_avg || 0) >= filters.rating);
      }

      if (filters.to) {
        const q = filters.to.toLowerCase();
        list = list.filter(t =>
          t.title_ar.toLowerCase().includes(q) ||
          t.title_en.toLowerCase().includes(q) ||
          (t.destination_country && t.destination_country.toLowerCase().includes(q))
        );
      }

      const sortBy = document.getElementById('sort-select').value;
      if (sortBy === 'price-low') list.sort((a, b) => a.base_price - b.base_price);
      else if (sortBy === 'price-high') list.sort((a, b) => b.base_price - a.base_price);
      else if (sortBy === 'rating') list.sort((a, b) => (b.rating_avg || 0) - (a.rating_avg || 0));
      else if (sortBy === 'days-low') list.sort((a, b) => a.days - b.days);
      else if (sortBy === 'days-high') list.sort((a, b) => b.days - a.days);
      else list.sort((a, b) => Number(b.id) - Number(a.id));

      filteredTrips = list;
      document.getElementById('results-number').textContent = list.length;
      renderTrips();
    }

    // ============================================
    // RENDER TRIPS
    // ============================================
    function renderTrips() {
      const grid = document.getElementById('trips-grid');
      const isAr = isRTL();

      if (filteredTrips.length === 0) {
        grid.innerHTML = `
          <div class="tarhal-empty" style="grid-column: 1 / -1;">
            <div class="tarhal-empty-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </div>
            <div class="tarhal-empty-title">${t('trips.noResults')}</div>
            <div class="tarhal-empty-text">${t('trips.noResultsDesc')}</div>
          </div>
        `;
        return;
      }

      grid.innerHTML = filteredTrips.map(trip => `
        <a href="trip.html?slug=${trip.slug}" class="tarhal-trip-card">
          <div class="tarhal-trip-card-image">
            <div class="tarhal-trip-card-placeholder">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              </svg>
            </div>
            <div class="tarhal-trip-card-badge">${t('tripTypes.' + trip.trip_type)}</div>
          </div>
          <div class="tarhal-trip-card-body">
            <h3 class="tarhal-trip-card-title">${isAr ? trip.title_ar : trip.title_en}</h3>
            <div class="tarhal-trip-card-meta">
              <span class="tarhal-trip-card-meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                ${trip.days} ${t('trips.days')}
              </span>
            </div>
            <div class="tarhal-trip-card-footer">
              <div>
                <div class="tarhal-trip-card-price-label">${t('trip.price')}</div>
                <div class="tarhal-trip-card-price">${formatPrice(trip.base_price, trip.currency)}</div>
              </div>
              ${trip.rating_avg > 0 ? `<div class="tarhal-trip-card-rating">⭐ ${trip.rating_avg.toFixed(1)}</div>` : ''}
            </div>
          </div>
        </a>
      `).join('');
    }
  </script>
