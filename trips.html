<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0F766E">
  <title>الرحلات — ترحال</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    /* ===== TOP SEARCH ===== */
    .top-search-bar {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      margin: 16px 0;
    }
    .top-search-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    @media (min-width: 640px) {
      .top-search-grid { grid-template-columns: 1fr 1fr 1fr auto; }
    }
    .ts-field-wrap { position: relative; }
    .ts-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: white;
      font-family: inherit;
      min-height: 42px;
      box-sizing: border-box;
      color: var(--text-dark);
    }
    .ts-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15,118,110,0.1);
    }

    /* ===== DATE WRAP WITH PLACEHOLDER ===== */
    .date-wrap { position: relative; }
    .date-wrap .ts-input { color: transparent; }
    .date-wrap.has-value .ts-input { color: var(--text-dark); }
    .date-placeholder {
      position: absolute;
      top: 50%;
      inset-inline-start
