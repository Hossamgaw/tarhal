<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0F766E">
  <title>الرحلات — ترحال</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .top-search-bar {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      margin: 16px 0;
    }
    .top-search-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    @media (min-width: 640px) {
      .top-search-grid { grid-template-columns: 1fr 1fr 1fr auto; }
    }
    .ts-field-wrap { position: relative; }
    .ts-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: white;
      font-family: inherit;
      min-height: 42px;
      box-sizing: border-box;
      color: var(--text-dark);
    }
    .ts-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15,118,110,0.1);
    }
    .date-wrap { position: relative; }
    .date-wrap .ts-input { color: transparent; }
    .date-wrap.has-value .ts-input { color: var(--text-dark); }
    .date-placeholder {
      position: absolute;
      top: 50%;
      inset-inline-start: 14px;
      transform: translateY(-50%);
      color: var(--text-gray);
      font-size: 14px;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .date-wrap.has-value .date-placeholder { display: none; }
    .ts-dd {
      position: absolute;
      top: 100%;
      inset-inline: 0;
      margin-top: 4px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      max-height: 260px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }
    .ts-dd.open { display: block; }
    .ts-dd-item {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    .ts-dd-item:last-child { border-bottom: none; }
    .ts-dd-item:hover, .ts-dd-item.active { background: rgba(15,118,110,0.06); }
    .ts-dd-flag { font-size: 18px; line-height: 1; }
    .ts-dd-name { flex: 1; }
    .ts-dd-sub { font-size: 11px; color: var(--text-gray); display: block; }
    .ts-dd-empty { padding: 14px; text-align: center; color: var(--text-gray); font-size: 13px; }
    .mobile-filter-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-weight: 600;
      color: var(--text-dark);
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }
    .mobile-filter-toggle:hover { border-color: var(--primary); color: var(--primary); }
    @media (min-width: 900px) { .mobile-filter-toggle { display: none; } }
    .trips-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      padding: 8px 0 40px;
    }
    @media (min-width: 900px) {
      .trips-layout { grid-template-columns: 280px 1fr; }
    }
    .filters-panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      height: fit-content;
    }
    .filters-panel.mobile-closed { display: none; }
    @media (min-width: 900px) {
      .filters-panel, .filters-panel.mobile-closed { display: block; }
    }
    .filter-group {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .filter-group:last-child {
      border-bottom: none;
      margin-bottom: 16px;
      padding-bottom: 0;
    }
    .filter-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 12px;
    }
    .filter-options { display: flex; flex-direction: column; gap: 4px; }
    .filter-check {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      cursor: pointer;
      padding: 6px 0;
      color: var(--text-medium);
    }
    .filter-check input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header id="app-header"></header>

<main class="tarhal-container">

  <!-- ===== TOP SEARCH ===== -->
  <div class="top-search-bar">
    <form class="top-search-grid" id="top-search-form" autocomplete="off">
      <div class="ts-field-wrap" id="ts-from-wrap">
        <input type="text" id="q-from" class="ts-input" placeholder="من — الدولة أو المدينة" autocomplete="off">
        <div class="ts-dd" id="ts-from-dd"></div>
      </div>
      <div class="ts-field-wrap" id="ts-to-wrap">
        <input type="text" id="q-to" class="ts-input" placeholder="إلى — الدولة أو المدينة" autocomplete="off">
        <div class="ts-dd" id="ts-to-dd"></div>
      </div>
      <div class="date-wrap" id="date-wrap">
        <input type="date" id="q-date" class="ts-input">
        <span class="date-placeholder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          اختر التاريخ
        </span>
      </div>
      <button type="submit" class="tarhal-btn tarhal-btn-primary">ابحث</button>
    </form>
  </div>

  <h1 style="font-size: 22px; font-weight: 700; margin-bottom: 16px;" id="page-title">الرحلات</h1>

  <button type="button" class="mobile-filter-toggle" id="filter-toggle">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
    </svg>
    <span>الفلاتر</span>
  </button>

  <div class="trips-layout">

    <aside class="filters-panel mobile-closed" id="filters-panel">

      <div class="filter-group">
        <div class="filter-title">نوع الرحلة</div>
        <div class="filter-options" id="type-filters"></div>
      </div>

      <div class="filter-group">
        <div class="filter-title">السعر</div>
        <div class="single-slider">
          <div class="single-slider-value" id="price-value">الكل</div>
          <input type="range" class="single-slider-input" id="price-range" min="0" max="1000" value="0">
          <div class="single-slider-marks">
            <span id="price-min-mark">—</span>
            <span id="price-max-mark">—</span>
          </div>
        </div>
      </div>

      <div class="filter-group">
        <div class="filter-title">المدة</div>
        <div class="single-slider">
          <div class="single-slider-value" id="days-value">الكل</div>
          <input type="range" class="single-slider-input" id="days-range" min="0" max="1000" value="0">
          <div class="single-slider-marks">
            <span id="days-min-mark">—</span>
            <span id="days-max-mark">—</span>
          </div>
        </div>
      </div>

      <div class="filter-group">
        <div class="filter-title">التقييم</div>
        <div class="rating-stars-display" id="rating-stars-display">
          <span class="rating-star" data-star="1">★</span>
          <span class="rating-star" data-star="2">★</span>
          <span class="rating-star" data-star="3">★</span>
          <span class="rating-star" data-star="4">★</span>
          <span class="rating-star" data-star="5">★</span>
        </div>
        <div class="rating-value-display" id="rating-value">الكل</div>
        <div class="single-slider" style="padding: 0;">
          <input type="range" class="single-slider-input rating-thumb" id="rating-range" min="0" max="100" value="0">
          <div class="single-slider-marks">
            <span>الكل</span>
            <span>⭐ 5</span>
          </div>
        </div>
      </div>

      <button type="button" class="tarhal-btn tarhal-btn-outline tarhal-btn-block" id="clear-filters">مسح الفلاتر</button>

    </aside>

    <section>
      <div class="results-header">
        <div class="results-count">
          <strong id="results-number">0</strong> نتيجة
        </div>
        <select class="sort-select" id="sort-select">
          <option value="newest">الأحدث</option>
          <option value="price-low">السعر: من الأقل للأعلى</option>
          <option value="price-high">السعر: من الأعلى للأقل</option>
          <option value="rating">الأعلى تقييمًا</option>
          <option value="days-low">المدة: الأقصر أولاً</option>
          <option value="days-high">المدة: الأطول أولاً</option>
        </select>
      </div>

      <div class="tarhal-grid tarhal-grid-3" id="trips-grid"></div>
    </section>

  </div>

</main>

<footer id="app-footer"></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>

  <script>
    // ============================================
    // STATE
    // ============================================
    let allTrips = [];
    let filteredTrips = [];
    let priceBounds = { min: 0, max: 100000 };
    let daysBounds = { min: 1, max: 30 };
    let filters = {
      types: [],
      maxPrice: null,
      maxDays: null,
      rating: null,
      from: '',
      to: '',
      date: '',
    };

    // ============================================
    // INIT
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      initApp();
      loadInitialData();
      renderTypeFilters();
      setupDateInput();
      setupPriceSlider();
      setupDaysSlider();
      setupRatingSlider();
      setupFilterEvents();
      setupSearchBar();
      setupTopAutocomplete();
      applyFiltersAndRender();
    });

    // ============================================
    // LOAD
    // ============================================
    function loadInitialData() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type');
      const from = params.get('from');
      const to = params.get('to');
      const date = params.get('date');
      const q = params.get('q');

      if (type) filters.types = [type];
      if (from) { filters.from = from; document.getElementById('q-from').value = from; }
      if (to) { filters.to = to; document.getElementById('q-to').value = to; }
      if (date) {
        filters.date = date;
        document.getElementById('q-date').value = date;
        document.getElementById('date-wrap').classList.add('has-value');
      }
      if (q) { filters.to = q; document.getElementById('q-to').value = q; }

      allTrips = [...MOCK_TRIPS];

      if (allTrips.length > 0) {
        const prices = allTrips.map(t => t.base_price);
        const daysArr = allTrips.map(t => t.days);
        priceBounds.min = Math.min(...prices);
        priceBounds.max = Math.max(...prices);
        daysBounds.min = Math.max(1, Math.min(...daysArr));
        daysBounds.max = Math.max(...daysArr);
      }

      if (type) {
        document.getElementById('page-title').textContent = t('tripTypes.' + type);
      }
    }

    // ============================================
    // TYPE FILTERS
    // ============================================
    function renderTypeFilters() {
      const container = document.getElementById('type-filters');
      const types = [
        { key: 'umrah' }, { key: 'hajj' }, { key: 'leisure' },
        { key: 'adventure' }, { key: 'family' }, { key: 'honeymoon' },
        { key: 'cruise' }, { key: 'cultural' },
      ];
      container.innerHTML = types.map(tp => `
        <label class="filter-check">
          <input type="checkbox" data-type="${tp.key}" ${filters.types.includes(tp.key) ? 'checked' : ''}>
          <span>${t('tripTypes.' + tp.key)}</span>
        </label>
      `).join('');
    }

    // ============================================
    // DATE INPUT PLACEHOLDER
    // ============================================
    function setupDateInput() {
      const input = document.getElementById('q-date');
      const wrap = document.getElementById('date-wrap');

      function update() {
        wrap.classList.toggle('has-value', !!input.value);
      }

      input.addEventListener('change', update);
      input.addEventListener('input', update);
      update();
    }

    // ============================================
    // PRICE SLIDER
    // ============================================
    function setupPriceSlider() {
      const input = document.getElementById('price-range');
      const valueDisplay = document.getElementById('price-value');
      const minMark = document.getElementById('price-min-mark');
      const maxMark = document.getElementById('price-max-mark');

      const STEPS = 1000;
      input.min = 0;
      input.max = STEPS;
      input.value = 0;

      minMark.textContent = formatPrice(priceBounds.min);
      maxMark.textContent = formatPrice(priceBounds.max);

      function update() {
        const step = Number(input.value);
        const value = Math.round(priceBounds.min + (priceBounds.max - priceBounds.min) * (step / STEPS));

        if (step === 0) {
          valueDisplay.textContent = 'الكل';
          filters.maxPrice = null;
        } else {
          valueDisplay.textContent = `من ${formatPrice(priceBounds.min)} حتى ${formatPrice(value)}`;
          filters.maxPrice = value;
        }

        applyFiltersAndRender();
      }

      input.addEventListener('input', update);

      if (!window._sliderResets) window._sliderResets = [];
      window._sliderResets.push(() => {
        input.value = 0;
        update();
      });

      update();
    }

    // ============================================
    // DAYS SLIDER
    // ============================================
    function setupDaysSlider() {
      const input = document.getElementById('days-range');
      const valueDisplay = document.getElementById('days-value');
      const minMark = document.getElementById('days-min-mark');
      const maxMark = document.getElementById('days-max-mark');

      const STEPS = 1000;
      input.min = 0;
      input.max = STEPS;
      input.value = 0;

      minMark.textContent = daysBounds.min + ' أيام';
      maxMark.textContent = daysBounds.max + ' يوم';

      function update() {
        const step = Number(input.value);
        const value = Math.round(daysBounds.min + (daysBounds.max - daysBounds.min) * (step / STEPS));

        if (step === 0) {
          valueDisplay.textContent = 'الكل';
          filters.maxDays = null;
        } else {
          valueDisplay.textContent = `من ${daysBounds.min} حتى ${value} أيام`;
          filters.maxDays = value;
        }

        applyFiltersAndRender();
      }

      input.addEventListener('input', update);

      if (!window._sliderResets) window._sliderResets = [];
      window._sliderResets.push(() => {
        input.value = 0;
        update();
      });

      update();
    }

    // ============================================
    // RATING SLIDER
    // ============================================
    function setupRatingSlider() {
      const range = document.getElementById('rating-range');
      const valueDisplay = document.getElementById('rating-value');
      const stars = document.querySelectorAll('#rating-stars-display .rating-star');

      const STEPS = 100;

      function update() {
        const step = Number(range.value);
        const rating = (step / STEPS) * 5;

        stars.forEach(star => {
          const starVal = Number(star.dataset.star);
          star.classList.toggle('active', starVal <= rating);
        });

        if (step === 0) {
          valueDisplay.textContent = 'الكل';
          filters.rating = null;
        } else {
          valueDisplay.textContent = `⭐ ${rating.toFixed(1)} فأكثر`;
          filters.rating = rating;
        }

        applyFiltersAndRender();
      }

      range.addEventListener('input', update);

      if (!window._sliderResets) window._sliderResets = [];
      window._sliderResets.push(() => {
        range.value = 0;
        update();
      });

      update();
    }

    // ============================================
    // FILTER EVENTS
    // ============================================
    function setupFilterEvents() {
      document.querySelectorAll('#type-filters input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
          filters.types = Array.from(document.querySelectorAll('#type-filters input:checked'))
            .map(el => el.dataset.type);
          applyFiltersAndRender();
        });
      });

      document.getElementById('sort-select').addEventListener('change', () => {
        applyFiltersAndRender();
      });

      document.getElementById('clear-filters').addEventListener('click', () => {
        filters = { types: [], maxPrice: null, maxDays: null, rating: null, from: '', to: '', date: '' };
        document.querySelectorAll('#type-filters input').forEach(cb => cb.checked = false);
        document.getElementById('q-from').value = '';
        document.getElementById('q-to').value = '';
        document.getElementById('q-date').value = '';
        document.getElementById('date-wrap').classList.remove('has-value');
        if (window._sliderResets) window._sliderResets.forEach(fn => fn());
        applyFiltersAndRender();
      });

      document.getElementById('filter-toggle').addEventListener('click', () => {
        document.getElementById('filters-panel').classList.toggle('mobile-closed');
      });
    }

    // ============================================
    // SEARCH BAR
    // ============================================
    function setupSearchBar() {
      document.getElementById('top-search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        filters.from = document.getElementById('q-from').value.trim();
        filters.to = document.getElementById('q-to').value.trim();
        filters.date = document.getElementById('q-date').value;
        applyFiltersAndRender();
      });
    }

    // ============================================
    // AUTOCOMPLETE
    // ============================================
    function setupTopAutocomplete() {
      new TopAutocomplete('q-from', 'ts-from-dd', 'ts-from-wrap');
      new TopAutocomplete('q-to', 'ts-to-dd', 'ts-to-wrap');
    }

    class TopAutocomplete {
      constructor(inputId, ddId, wrapId) {
        this.input = document.getElementById(inputId);
        this.dd = document.getElementById(ddId);
        this.wrap = document.getElementById(wrapId);
        this.items = [];
        this.activeIndex = -1;
        this._debounce = null;
        this.init();
      }
      init() {
        this.input.addEventListener('focus', () => this.onFocus());
        this.input.addEventListener('input', () => this.onInput());
        this.input.addEventListener('keydown', (e) => this.onKey(e));
        document.addEventListener('click', (e) => {
          if (!this.wrap.contains(e.target)) this.close();
        });
      }
      async onFocus() { if (!this.input.value) await this.showResults(''); }
      onInput() {
        clearTimeout(this._debounce);
        this._debounce = setTimeout(async () => {
          const q = this.input.value.trim();
          if (q.length === 0) { this.close(); return; }
          await this.showResults(q);
        }, 120);
      }
      async showResults(query) {
        this.dd.innerHTML = '<div class="ts-dd-empty">...</div>';
        this.dd.classList.add('open');
        try {
          if (query.length === 0) {
            const isAr = isRTL();
            this.items = COUNTRIES_DB.slice(0, 20).map(c => ({
              type: 'country', code: c.code, flag: c.flag,
              name: isAr ? c.ar : c.en,
              sub: isAr ? c.en : c.ar,
              displayName: `${c.flag} ${isAr ? c.ar : c.en}`,
            }));
          } else {
            this.items = await searchAll(query);
          }
        } catch (e) { this.items = []; }
        this.render();
      }
      render() {
        if (this.items.length === 0) {
          this.dd.innerHTML = `<div class="ts-dd-empty">لا توجد نتائج</div>`;
          return;
        }
        this.dd.innerHTML = this.items.map((item, i) => `
          <div class="ts-dd-item" data-index="${i}">
            <span class="ts-dd-flag">${item.flag || '📍'}</span>
            <span class="ts-dd-name">
              ${item.name}
              <span class="ts-dd-sub">${item.sub || ''}</span>
            </span>
          </div>
        `).join('');
        this.dd.querySelectorAll('.ts-dd-item').forEach(el => {
          el.addEventListener('click', () => this.select(Number(el.dataset.index)));
        });
        this.activeIndex = -1;
      }
      select(index) {
        const item = this.items[index];
        if (!item) return;
        this.input.value = item.displayName;
        this.close();
      }
      onKey(e) {
        if (!this.dd.classList.contains('open')) return;
        const items = this.dd.querySelectorAll('.ts-dd-item');
        if (items.length === 0) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          this.activeIndex = Math.min(this.activeIndex + 1, items.length - 1);
          this.highlight(items);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          this.activeIndex = Math.max(this.activeIndex - 1, 0);
          this.highlight(items);
        } else if (e.key === 'Enter') {
          if (this.activeIndex >= 0) { e.preventDefault(); this.select(this.activeIndex); }
        } else if (e.key === 'Escape') { this.close(); }
      }
      highlight(items) {
        items.forEach((el, i) => el.classList.toggle('active', i === this.activeIndex));
      }
      close() {
        this.dd.classList.remove('open');
        this.dd.innerHTML = '';
        this.activeIndex = -1;
      }
    }

    // ============================================
    // APPLY FILTERS
    // ============================================
    function applyFiltersAndRender() {
      let list = [...allTrips];

      if (filters.types.length > 0) {
        list = list.filter(trip => filters.types.includes(trip.trip_type));
      }
      if (filters.maxPrice != null) list = list.filter(t => t.base_price <= filters.maxPrice);
      if (filters.maxDays != null) list = list.filter(t => t.days <= filters.maxDays);
      if (filters.rating != null) {
        list = list.filter(t => (t.rating_avg || 0) >= filters.rating);
      }
      if (filters.to) {
        const q = filters.to.toLowerCase();
        list = list.filter(t =>
          t.title_ar.toLowerCase().includes(q) ||
          t.title_en.toLowerCase().includes(q) ||
          (t.destination_country && t.destination_country.toLowerCase().includes(q))
        );
      }

      const sortBy = document.getElementById('sort-select').value;
      if (sortBy === 'price-low') list.sort((a, b) => a.base_price - b.base_price);
      else if (sortBy === 'price-high') list.sort((a, b) => b.base_price - a.base_price);
      else if (sortBy === 'rating') list.sort((a, b) => (b.rating_avg || 0) - (a.rating_avg || 0));
      else if (sortBy === 'days-low') list.sort((a, b) => a.days - b.days);
      else if (sortBy === 'days-high') list.sort((a, b) => b.days - a.days);
      else list.sort((a, b) => Number(b.id) - Number(a.id));

      filteredTrips = list;
      document.getElementById('results-number').textContent = list.length;
      renderTrips();
    }

    // ============================================
    // RENDER TRIPS
    // ============================================
    function renderTrips() {
      const grid = document.getElementById('trips-grid');
      const isAr = isRTL();

      if (filteredTrips.length === 0) {
        grid.innerHTML = `
          <div class="tarhal-empty" style="grid-column: 1 / -1;">
            <div class="tarhal-empty-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </div>
            <div class="tarhal-empty-title">${t('trips.noResults')}</div>
            <div class="tarhal-empty-text">${t('trips.noResultsDesc')}</div>
          </div>
        `;
        return;
      }

      grid.innerHTML = filteredTrips.map(trip => `
        <a href="trip.html?slug=${trip.slug}" class="tarhal-trip-card">
          <div class="tarhal-trip-card-image">
            <div class="tarhal-trip-card-placeholder">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              </svg>
            </div>
            <div class="tarhal-trip-card-badge">${t('tripTypes.' + trip.trip_type)}</div>
          </div>
          <div class="tarhal-trip-card-body">
            <h3 class="tarhal-trip-card-title">${isAr ? trip.title_ar : trip.title_en}</h3>
            <div class="tarhal-trip-card-meta">
              <span class="tarhal-trip-card-meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                ${trip.days} ${t('trips.days')}
              </span>
            </div>
            <div class="tarhal-trip-card-footer">
              <div>
                <div class="tarhal-trip-card-price-label">${t('trip.price')}</div>
                <div class="tarhal-trip-card-price">${formatPrice(trip.base_price, trip.currency)}</div>
              </div>
              ${trip.rating_avg > 0 ? `<div class="tarhal-trip-card-rating">⭐ ${trip.rating_avg.toFixed(1)}</div>` : ''}
            </div>
          </div>
        </a>
      `).join('');
    }
  </script>

</body>
</html>
