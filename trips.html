<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0F766E">
  <title>الرحلات — ترحال</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .top-search-bar {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      margin: 16px 0;
    }
    .top-search-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    @media (min-width: 640px) {
      .top-search-grid { grid-template-columns: 1fr 1fr 1fr auto; }
    }
    .ts-field-wrap { position: relative; }
    .ts-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: white;
      font-family: inherit;
      min-height: 42px;
      box-sizing: border-box;
      color: var(--text-dark);
    }
    .ts-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15,118,110,0.1);
    }
    .date-wrap { position: relative; }
    .date-wrap .ts-input { color: transparent; }
    .date-wrap.has-value .ts-input { color: var(--text-dark); }
    .date-placeholder {
      position: absolute;
      top: 50%;
      inset-inline-start: 14px;
      transform: translateY(-50%);
      color: var(--text-gray);
      font-size: 14px;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .date-wrap.has-value .date-placeholder { display: none; }
    .ts-dd {
      position: absolute;
      top: 100%;
      inset-inline: 0;
      margin-top: 4px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      max-height: 260px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }
    .ts-dd.open { display: block; }
    .ts-dd-item {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    .ts-dd-item:last-child { border-bottom: none; }
    .ts-dd-item:hover, .ts-dd-item.active { background: rgba(15,118,110,0.06); }
    .ts-dd-flag { font-size: 18px; line-height: 1; }
    .ts-dd-name { flex: 1; }
    .ts-dd-sub { font-size: 11px; color: var(--text-gray); display: block; }
    .ts-dd-empty { padding: 14px; text-align: center; color: var(--text-gray); font-size: 13px; }
    .mobile-filter-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-weight: 600;
      color: var(--text-dark);
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }
    .mobile-filter-toggle:hover { border-color: var(--primary); color: var(--primary); }
    @media (min-width: 900px) { .mobile-filter-toggle { display: none; } }
    .trips-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      padding: 8px 0 40px;
    }
    @media (min-width: 900px) {
      .trips-layout { grid-template-columns: 280px 1fr; }
    }
    .filters-panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      height: fit-content;
    }
    .filters-panel.mobile-closed { display: none; }
    @media (min-width: 900px) {
      .filters-panel, .filters-panel.mobile-closed { display: block; }
    }
    .filter-group {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .filter-group:last-child {
      border-bottom: none;
      margin-bottom: 16px;
      padding-bottom: 0;
    }
    .filter-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 12px;
    }
    .filter-options { display: flex; flex-direction: column; gap: 4px; }
    .filter-check {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      cursor: pointer;
      padding: 6px 0;
      color: var(--text-medium);
    }
    .filter-check input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
