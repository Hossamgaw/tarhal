<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0F766E">
  <meta name="description" content="ترحال — منصة الرحلات العالمية">
  <title>ترحال — شوف رحلتك… قبل ما تبدأ</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    /* ===== SEARCH FORM ===== */
    .tarhal-search-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tarhal-search-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .tarhal-search-row-full {
      grid-template-columns: 1fr auto;
    }
    .tarhal-field-wrap {
      position: relative;
    }
    .tarhal-field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-gray);
      margin-bottom: 4px;
      display: block;
    }
    .tarhal-field-icon {
      position: absolute;
      inset-inline-start: 14px;
      top: calc(50% + 10px);
      transform: translateY(-50%);
      color: var(--primary);
      pointer-events: none;
    }
    .tarhal-field-wrap .tarhal-input {
      padding-inline-start: 40px;
    }

    /* ===== AUTOCOMPLETE DROPDOWN ===== */
    .tarhal-dd {
      position: absolute;
      top: 100%;
      inset-inline: 0;
      margin-top: 4px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      max-height: 280px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }
    .tarhal-dd.open { display: block; }
    .tarhal-dd-item {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    .tarhal-dd-item:last-child { border-bottom: none; }
    .tarhal-dd-item:hover,
    .tarhal-dd-item.active {
      background: rgba(15,118,110,0.06);
    }
    .tarhal-dd-flag { font-size: 20px; line-height: 1; }
    .tarhal-dd-name { flex: 1; }
    .tarhal-dd-sub {
      font-size: 11px;
      color: var(--text-gray);
      display: block;
    }
    .tarhal-dd-empty {
      padding: 16px;
      text-align: center;
      color: var(--text-gray);
      font-size: 13px;
    }
    .tarhal-field-wrap.has-value .tarhal-input {
      border-color: var(--primary);
      background: rgba(15,118,110,0.04);
    }

    @media (min-width: 640px) {
      .tarhal-search-row {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>

  <header id="app-header"></header>

  <main>
    <!-- ============== HERO ============== -->
    <section class="tarhal-hero">
      <div class="tarhal-container">
        <h1 id="hero-title">كل رحلات العالم في مكان واحد</h1>
        <p id="hero-subtitle">اكتشف، قارن، احجز، وتابع رحلتك كاملة</p>

        <div class="tarhal-hero-search">
          <form class="tarhal-search-form" id="search-form" autocomplete="off">

            <div class="tarhal-search-row">
              <!-- FROM -->
              <div class="tarhal-field-wrap" id="from-wrap">
                <label class="tarhal-field-label" id="from-label">من</label>
                <svg class="tarhal-field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <circle cx="12" cy="10" r="3"/>
                  <path d="M12 21s-8-7.5-8-13a8 8 0 1 1 16 0c0 5.5-8 13-8 13z"/>
                </svg>
                <input type="text" id="from-input" class="tarhal-input" placeholder="الدولة أو المدينة" autocomplete="off">
                <div class="tarhal-dd" id="from-dd"></div>
              </div>

              <!-- TO -->
              <div class="tarhal-field-wrap" id="to-wrap">
                <label class="tarhal-field-label" id="to-label">إلى</label>
                <svg class="tarhal-field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <circle cx="12" cy="10" r="3"/>
                  <path d="M12 21s-8-7.5-8-13a8 8 0 1 1 16 0c0 5.5-8 13-8 13z"/>
                </svg>
                <input type="text" id="to-input" class="tarhal-input" placeholder="الدولة أو المدينة" autocomplete="off">
                <div class="tarhal-dd" id="to-dd"></div>
              </div>
            </div>

            <div class="tarhal-search-row tarhal-search-row-full">
              <input type="date" id="search-date" class="tarhal-input" aria-label="التاريخ">
              <button type="submit" class="tarhal-btn tarhal-btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <circle cx="11" cy="11" r="8"/>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <span id="search-btn-text">ابحث</span>
              </button>
            </div>

          </form>
        </div>
      </div>
    </section>

    <!-- ============== TRIP TYPES ============== -->
    <section class="tarhal-section">
      <div class="tarhal-container">
        <div class="tarhal-section-header">
          <h2 class="tarhal-section-title" id="types-title">أنواع الرحلات</h2>
        </div>
        <div class="tarhal-grid tarhal-grid-4" id="trip-types-grid"></div>
      </div>
    </section>

    <!-- ============== HOW IT WORKS ============== -->
    <section class="tarhal-section" style="background: var(--bg-light);">
      <div class="tarhal-container">
        <div class="tarhal-section-header">
          <h2 class="tarhal-section-title" id="how-title">كيف يعمل ترحال؟</h2>
        </div>
        <div class="tarhal-grid tarhal-grid-4" id="how-grid"></div>
      </div>
    </section>

    <!-- ============== FEATURED TRIPS ============== -->
    <section class="tarhal-section">
      <div class="tarhal-container">
        <div class="tarhal-section-header">
          <h2 class="tarhal-section-title" id="featured-title">رحلات مميزة</h2>
          <a href="trips.html" class="tarhal-section-link" id="view-all-link">
            <span>شاهد الكل</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </a>
        </div>
        <div class="tarhal-grid tarhal-grid-3" id="featured-trips-grid"></div>
      </div>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <!-- ============== SCRIPTS ============== -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    // ============================================
    // INIT
    // ============================================
    document.addEventListener('DOMContentLoaded', async () => {
      initApp();
      updateStaticTexts();

      await initUserCurrency();

      renderTripTypes();
      renderHowItWorks();
      renderFeaturedTrips();

      new TarhalAutocomplete('from-input', 'from-dd', 'from-wrap');
      new TarhalAutocomplete('to-input', 'to-dd', 'to-wrap');

      document.getElementById('search-form').addEventListener('submit', handleSearch);
    });

    // ============================================
    // CURRENCY DETECTION
    // ============================================
    async function initUserCurrency() {
      if (localStorage.getItem('currency')) return;
      try {
        const detected = await detectUserCountry();
        if (detected && detected.currency) setCurrency(detected.currency);
      } catch (e) { /* ignore */ }
    }

    // ============================================
    // STATIC TEXTS
    // ============================================
    function updateStaticTexts() {
      document.getElementById('hero-title').textContent = t('home.hero');
      document.getElementById('hero-subtitle').textContent = t('home.sub');
      document.getElementById('from-label').textContent = t('home.from');
      document.getElementById('to-label').textContent = t('home.to');
      document.getElementById('from-input').placeholder = t('home.searchPlaceholder');
      document.getElementById('to-input').placeholder = t('home.searchPlaceholder');
      document.getElementById('search-btn-text').textContent = t('home.search');
      document.getElementById('types-title').textContent = t('home.types');
      document.getElementById('how-title').textContent = t('home.howItWorks');
      document.getElementById('featured-title').textContent = t('home.featured');
      document.querySelector('#view-all-link span').textContent = t('home.viewAll');
      document.title = t('app.name') + ' — ' + t('app.tagline');
    }

    // ============================================
    // AUTOCOMPLETE CLASS
    // ============================================
    class TarhalAutocomplete {
      constructor(inputId, ddId, wrapId) {
        this.input = document.getElementById(inputId);
        this.dd = document.getElementById(ddId);
        this.wrap = document.getElementById(wrapId);
        this.items = [];
        this.activeIndex = -1;
        this._debounce = null;
        this.init();
      }

      init() {
        this.input.addEventListener('focus', () => this.onFocus());
        this.input.addEventListener('input', () => this.onInput());
        this.input.addEventListener('keydown', (e) => this.onKey(e));
        document.addEventListener('click', (e) => {
          if (!this.wrap.contains(e.target)) this.close();
        });
      }

      async onFocus() {
        if (!this.input.value) await this.showResults('');
      }

      onInput() {
        clearTimeout(this._debounce);
        this._debounce = setTimeout(async () => {
          const q = this.input.value.trim();
          if (q.length === 0) { this.close(); return; }
          await this.showResults(q);
        }, 120);
      }

      async showResults(query) {
        this.dd.innerHTML = '<div class="tarhal-dd-empty">...</div>';
        this.dd.classList.add('open');

        try {
          if (query.length === 0) {
            const isAr = isRTL();
            this.items = COUNTRIES_DB.slice(0, 20).map(c => ({
              type: 'country',
              code: c.code,
              flag: c.flag,
              name: isAr ? c.ar : c.en,
              sub: isAr ? c.en : c.ar,
              displayName: `${c.flag} ${isAr ? c.ar : c.en}`,
            }));
          } else {
            this.items = await searchAll(query);
          }
        } catch (e) {
          this.items = [];
        }

        this.render();
      }

      render() {
        if (this.items.length === 0) {
          this.dd.innerHTML = `<div class="tarhal-dd-empty">لا توجد نتائج — جرب دولة أو مدينة تانية</div>`;
          return;
        }

        this.dd.innerHTML = this.items.map((item, i) => `
          <div class="tarhal-dd-item" data-index="${i}">
            <span class="tarhal-dd-flag">${item.flag || '📍'}</span>
            <span class="tarhal-dd-name">
              ${item.name}
              <span class="tarhal-dd-sub">${item.sub || ''}</span>
            </span>
          </div>
        `).join('');

        this.dd.querySelectorAll('.tarhal-dd-item').forEach(el => {
          el.addEventListener('click', () => this.select(Number(el.dataset.index)));
        });

        this.activeIndex = -1;
      }

      select(index) {
        const item = this.items[index];
        if (!item) return;
        this.input.value = item.displayName;
        this.wrap.classList.add('has-value');
        this.close();
      }

      onKey(e) {
        if (!this.dd.classList.contains('open')) return;
        const items = this.dd.querySelectorAll('.tarhal-dd-item');
        if (items.length === 0) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          this.activeIndex = Math.min(this.activeIndex + 1, items.length - 1);
          this.highlight(items);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          this.activeIndex = Math.max(this.activeIndex - 1, 0);
          this.highlight(items);
        } else if (e.key === 'Enter') {
          if (this.activeIndex >= 0) {
            e.preventDefault();
            this.select(this.activeIndex);
          }
        } else if (e.key === 'Escape') {
          this.close();
        }
      }

      highlight(items) {
        items.forEach((el, i) => el.classList.toggle('active', i === this.activeIndex));
      }

      close() {
        this.dd.classList.remove('open');
        this.dd.innerHTML = '';
        this.activeIndex = -1;
      }
    }

    // ============================================
    // SEARCH SUBMIT
    // ============================================
    function handleSearch(e) {
      e.preventDefault();
      const from = document.getElementById('from-input').value.trim();
      const to = document.getElementById('to-input').value.trim();
      const date = document.getElementById('search-date').value;

      const params = new URLSearchParams();
      if (from) params.set('from', from);
      if (to) params.set('to', to);
      if (date) params.set('date', date);

      window.location.href = 'trips.html' + (params.toString() ? '?' + params.toString() : '');
    }

    // ============================================
    // TRIP TYPES
    // ============================================
    function renderTripTypes() {
      const grid = document.getElementById('trip-types-grid');
      if (!grid) return;
      const types = [
        { key: 'umrah', icon: '🕌' },
        { key: 'hajj', icon: '🕋' },
        { key: 'leisure', icon: '🏖️' },
        { key: 'adventure', icon: '🏔️' },
        { key: 'family', icon: '👨‍👩‍👧' },
        { key: 'honeymoon', icon: '💑' },
        { key: 'cruise', icon: '🚢' },
        { key: 'cultural', icon: '🏛️' },
      ];
      grid.innerHTML = types.map(type => `
        <a href="trips.html?type=${type.key}" class="tarhal-type-card">
          <div class="tarhal-type-icon" style="font-size: 24px;">${type.icon}</div>
          <div class="tarhal-type-name">${t('tripTypes.' + type.key)}</div>
        </a>
      `).join('');
    }

    // ============================================
    // HOW IT WORKS
    // ============================================
    function renderHowItWorks() {
      const grid = document.getElementById('how-grid');
      if (!grid) return;
      const steps = [
        { num: '1', key: 'step1', descKey: 'step1Desc', icon: '🔍' },
        { num: '2', key: 'step2', descKey: 'step2Desc', icon: '⚖️' },
        { num: '3', key: 'step3', descKey: 'step3Desc', icon: '✅' },
        { num: '4', key: 'step4', descKey: 'step4Desc', icon: '📍' },
      ];
      grid.innerHTML = steps.map(step => `
        <div class="tarhal-card" style="text-align: center;">
          <div style="width:56px;height:56px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,#0F766E,#14B8A6);color:white;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;box-shadow:0 8px 20px rgba(15,118,110,0.25);">${step.num}</div>
          <div style="font-size:32px;margin-bottom:8px;">${step.icon}</div>
          <div style="font-size:16px;font-weight:700;margin-bottom:6px;color:var(--text-dark);">${t('home.'+step.key)}</div>
          <div style="font-size:13px;color:var(--text-gray);line-height:1.6;">${t('home.'+step.descKey)}</div>
        </div>
      `).join('');
    }

    // ============================================
    // FEATURED TRIPS
    // ============================================
    function renderFeaturedTrips() {
      const grid = document.getElementById('featured-trips-grid');
      if (!grid) return;
      const trips = MOCK_TRIPS.slice(0, 6);
      const isAr = isRTL();
      grid.innerHTML = trips.map(trip => `
        <a href="trip.html?slug=${trip.slug}" class="tarhal-trip-card">
          <div class="tarhal-trip-card-image">
            <div class="tarhal-trip-card-placeholder">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              </svg>
            </div>
            <div class="tarhal-trip-card-badge">${t('tripTypes.'+trip.trip_type)}</div>
          </div>
          <div class="tarhal-trip-card-body">
            <h3 class="tarhal-trip-card-title">${isAr ? trip.title_ar : trip.title_en}</h3>
            <div class="tarhal-trip-card-meta">
              <span class="tarhal-trip-card-meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                ${trip.days} ${t('trips.days')}
              </span>
            </div>
            <div class="tarhal-trip-card-footer">
              <div>
                <div class="tarhal-trip-card-price-label">${t('trip.price')}</div>
                <div class="tarhal-trip-card-price">${formatPrice(trip.base_price, trip.currency)}</div>
              </div>
              ${trip.rating_avg > 0 ? `<div class="tarhal-trip-card-rating">⭐ ${trip.rating_avg.toFixed(1)}</div>` : ''}
            </div>
          </div>
        </a>
      `).join('');
    }
  </script>

</body>
</html>
